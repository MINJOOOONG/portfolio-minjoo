<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #211D19; }
    .title { font-size: 13px; font-weight: 700; }
    .label { font-size: 11px; font-weight: 600; }
    .sublabel { font-size: 10px; fill: #5A5149; }
    .layer-label { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; fill: #7A7067; text-transform: uppercase; }
    .box { stroke: #211D19; stroke-width: 1; rx: 6; fill: none; }
    .box-filled { stroke: #211D19; stroke-width: 1; rx: 6; fill: #FAFAFA; }
    .layer-box { stroke: rgba(33,29,25,0.15); stroke-width: 1; rx: 10; fill: none; stroke-dasharray: 4 3; }
    .arrow { stroke: #211D19; stroke-width: 0.8; marker-end: url(#arrow); }
    .arrow-light { stroke: rgba(33,29,25,0.3); stroke-width: 0.8; marker-end: url(#arrow-light); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#211D19" stroke-width="0.8"/>
    </marker>
    <marker id="arrow-light" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="rgba(33,29,25,0.3)" stroke-width="0.8"/>
    </marker>
  </defs>

  <!-- User -->
  <rect x="280" y="20" width="120" height="32" class="box"/>
  <text x="340" y="41" text-anchor="middle" class="label">User</text>
  <line x1="340" y1="52" x2="340" y2="78" class="arrow"/>

  <!-- Frontend Layer -->
  <rect x="40" y="78" width="600" height="150" class="layer-box"/>
  <text x="60" y="96" class="layer-label">FRONTEND LAYER</text>

  <rect x="70" y="108" width="160" height="32" class="box-filled"/>
  <text x="150" y="129" text-anchor="middle" class="label">Next.js App Router</text>

  <rect x="250" y="108" width="160" height="32" class="box-filled"/>
  <text x="330" y="129" text-anchor="middle" class="label">Section Navigation</text>

  <rect x="430" y="108" width="180" height="32" class="box-filled"/>
  <text x="520" y="129" text-anchor="middle" class="label">Project Detail Modal</text>

  <rect x="70" y="158" width="140" height="32" class="box-filled"/>
  <text x="140" y="179" text-anchor="middle" class="label">Custom Cursor</text>

  <rect x="230" y="158" width="140" height="32" class="box-filled"/>
  <text x="300" y="179" text-anchor="middle" class="label">Three.js 3D BG</text>

  <rect x="390" y="158" width="160" height="32" class="box-filled"/>
  <text x="470" y="179" text-anchor="middle" class="label">PortfolioAskBar</text>

  <!-- Arrow down to Data Layer -->
  <line x1="150" y1="228" x2="150" y2="260" class="arrow"/>
  <line x1="470" y1="228" x2="470" y2="260" class="arrow"/>

  <!-- Data / CMS Layer -->
  <rect x="40" y="260" width="360" height="110" class="layer-box"/>
  <text x="60" y="278" class="layer-label">DATA / CMS LAYER</text>

  <rect x="70" y="290" width="140" height="32" class="box-filled"/>
  <text x="140" y="311" text-anchor="middle" class="label">Prisma ORM</text>

  <rect x="230" y="290" width="150" height="32" class="box-filled"/>
  <text x="305" y="311" text-anchor="middle" class="label">Neon PostgreSQL</text>

  <rect x="70" y="332" width="120" height="28" class="box-filled"/>
  <text x="130" y="350" text-anchor="middle" class="sublabel">Admin CRUD</text>

  <rect x="210" y="332" width="120" height="28" class="box-filled"/>
  <text x="270" y="350" text-anchor="middle" class="sublabel">Site Settings</text>

  <!-- AI / RAG Layer -->
  <rect x="420" y="260" width="220" height="180" class="layer-box"/>
  <text x="440" y="278" class="layer-label">AI / RAG LAYER</text>

  <rect x="440" y="292" width="180" height="28" class="box-filled"/>
  <text x="530" y="310" text-anchor="middle" class="sublabel">Portfolio Documents</text>

  <rect x="440" y="328" width="180" height="28" class="box-filled"/>
  <text x="530" y="346" text-anchor="middle" class="sublabel">Embedding + FAISS Index</text>

  <rect x="440" y="364" width="180" height="28" class="box-filled"/>
  <text x="530" y="382" text-anchor="middle" class="sublabel">FastAPI Server</text>

  <rect x="440" y="400" width="180" height="28" class="box-filled"/>
  <text x="530" y="418" text-anchor="middle" class="sublabel">Groq LLM Answer</text>

  <!-- Arrows between RAG components -->
  <line x1="530" y1="320" x2="530" y2="328" class="arrow-light"/>
  <line x1="530" y1="356" x2="530" y2="364" class="arrow-light"/>
  <line x1="530" y1="392" x2="530" y2="400" class="arrow-light"/>

  <!-- Bottom flow -->
  <line x1="530" y1="428" x2="530" y2="470" class="arrow"/>

  <!-- Response -->
  <rect x="200" y="470" width="340" height="36" class="box"/>
  <text x="370" y="488" text-anchor="middle" class="label">Answer + Sources + Section Navigation</text>

  <!-- Arrow from response back to frontend -->
  <line x1="370" y1="506" x2="370" y2="540" class="arrow"/>

  <rect x="220" y="540" width="300" height="32" class="box"/>
  <text x="370" y="561" text-anchor="middle" class="label">UI: Answer Display + Section Move</text>
</svg>
