<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">E-commerce backend architecture overview</title>
  <desc id="desc">Clean architecture layers, Redis, Kafka, payment gateway, batch, and ranking data flows.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#d8d3c8;stroke-width:1.4}.box{fill:#f7f3ea;stroke:#b8a982;stroke-width:1.5}.accent{fill:#e8f3ef;stroke:#79a68f}.warn{fill:#fff0e6;stroke:#d69867}.data{fill:#eef2fb;stroke:#7a91c8}.text{font-family:Inter,Arial,sans-serif;fill:#222;font-size:15px}.small{font-size:12px;fill:#555}.title{font-size:24px;font-weight:700}.label{font-size:13px;font-weight:700}.arrow{stroke:#6f6a60;stroke-width:1.7;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#6f6a60"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="620"/>
  <text class="text title" x="40" y="48">E-commerce Backend Architecture</text>
  <text class="text small" x="42" y="74">Core transaction stays small. Expensive or failure-prone work moves to Redis, Kafka, Outbox, and Batch.</text>

  <rect class="panel" x="40" y="112" width="900" height="155" rx="16"/>
  <text class="text label" x="65" y="143">Clean Architecture Layers</text>
  <rect class="box" x="70" y="170" width="175" height="62" rx="10"/>
  <text class="text" x="98" y="195">Interfaces</text>
  <text class="text small" x="92" y="216">Controller / DTO</text>
  <rect class="box" x="285" y="170" width="175" height="62" rx="10"/>
  <text class="text" x="318" y="195">Application</text>
  <text class="text small" x="322" y="216">Facade / UseCase</text>
  <rect class="box" x="500" y="170" width="175" height="62" rx="10"/>
  <text class="text" x="545" y="195">Domain</text>
  <text class="text small" x="532" y="216">Entity / Service</text>
  <rect class="box" x="715" y="170" width="175" height="62" rx="10"/>
  <text class="text" x="745" y="195">Infrastructure</text>
  <text class="text small" x="742" y="216">Repository / PG / Kafka</text>
  <path class="arrow" d="M245 201 H280"/>
  <path class="arrow" d="M460 201 H495"/>
  <path class="arrow" d="M675 201 H710"/>

  <rect class="panel" x="40" y="305" width="900" height="245" rx="16"/>
  <text class="text label" x="65" y="336">Runtime Flow</text>
  <rect class="accent" x="70" y="372" width="135" height="58" rx="10"/>
  <text class="text" x="102" y="397">Client</text>
  <text class="text small" x="92" y="417">API request</text>
  <rect class="accent" x="245" y="372" width="150" height="58" rx="10"/>
  <text class="text" x="272" y="397">Redis</text>
  <text class="text small" x="266" y="417">Queue / ZSET / Lua</text>
  <rect class="box" x="435" y="372" width="150" height="58" rx="10"/>
  <text class="text" x="465" y="397">Order Core</text>
  <text class="text small" x="463" y="417">small transaction</text>
  <rect class="data" x="625" y="372" width="135" height="58" rx="10"/>
  <text class="text" x="663" y="397">DB</text>
  <text class="text small" x="650" y="417">Order / Outbox</text>
  <rect class="warn" x="800" y="372" width="110" height="58" rx="10"/>
  <text class="text" x="831" y="397">PG</text>
  <text class="text small" x="817" y="417">external call</text>
  <path class="arrow" d="M205 401 H240"/>
  <path class="arrow" d="M395 401 H430"/>
  <path class="arrow" d="M585 401 H620"/>
  <path class="arrow" d="M760 401 H795"/>

  <rect class="data" x="245" y="470" width="150" height="58" rx="10"/>
  <text class="text" x="288" y="495">Kafka</text>
  <text class="text small" x="268" y="515">async consumers</text>
  <rect class="accent" x="435" y="470" width="150" height="58" rx="10"/>
  <text class="text" x="470" y="495">Ranking</text>
  <text class="text small" x="466" y="515">Redis ZSET API</text>
  <rect class="box" x="625" y="470" width="135" height="58" rx="10"/>
  <text class="text" x="660" y="495">Batch</text>
  <text class="text small" x="643" y="515">daily / weekly / monthly</text>
  <path class="arrow" d="M690 430 C690 452 390 443 322 468"/>
  <path class="arrow" d="M395 499 H430"/>
  <path class="arrow" d="M585 499 H620"/>
</svg>
