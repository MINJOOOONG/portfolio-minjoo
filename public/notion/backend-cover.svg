<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1020"/>
      <stop offset="1" stop-color="#13233F"/>
    </linearGradient>
    <linearGradient id="accent" x1="382" y1="160" x2="1110" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1500" height="600" fill="url(#bg)"/>
  <rect width="1500" height="600" fill="url(#grid)"/>
  <circle cx="1260" cy="80" r="240" fill="#58A6FF" fill-opacity="0.07"/>
  <circle cx="160" cy="590" r="280" fill="#7EE787" fill-opacity="0.05"/>

  <g opacity="0.8" stroke="url(#accent)" stroke-width="3">
    <path d="M480 220H680"/>
    <path d="M820 220H1020"/>
    <path d="M750 292V400"/>
    <path d="M480 400H680"/>
    <path d="M820 400H1020"/>
  </g>
  <g fill="#9CCBFF">
    <circle cx="580" cy="220" r="7"/>
    <circle cx="920" cy="220" r="7"/>
    <circle cx="750" cy="350" r="7"/>
    <circle cx="580" cy="400" r="7"/>
    <circle cx="920" cy="400" r="7"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="150" width="230" height="140" rx="22" fill="#111C32" stroke="#58A6FF" stroke-opacity="0.8"/>
    <rect x="1020" y="150" width="230" height="140" rx="22" fill="#111C32" stroke="#7EE787" stroke-opacity="0.8"/>
    <rect x="650" y="150" width="200" height="142" rx="26" fill="#172A48" stroke="url(#accent)" stroke-width="2"/>
    <rect x="250" y="330" width="230" height="140" rx="22" fill="#111C32" stroke="#D2A8FF" stroke-opacity="0.8"/>
    <rect x="1020" y="330" width="230" height="140" rx="22" fill="#111C32" stroke="#FFA657" stroke-opacity="0.8"/>
    <rect x="650" y="400" width="200" height="80" rx="20" fill="#101A2D" stroke="#8B949E" stroke-opacity="0.8"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="365" y="203" fill="#8B949E" font-size="20">CLIENT</text>
    <text x="365" y="246" fill="#F0F6FC" font-size="28" font-weight="700">Product Flow</text>

    <text x="750" y="203" fill="#9CCBFF" font-size="20">APPLICATION</text>
    <text x="750" y="246" fill="#FFFFFF" font-size="29" font-weight="700">Spring Boot</text>

    <text x="1135" y="203" fill="#7EE787" font-size="20">DATA</text>
    <text x="1135" y="246" fill="#F0F6FC" font-size="28" font-weight="700">MySQL · Redis</text>

    <text x="365" y="383" fill="#D2A8FF" font-size="20">EVENTS</text>
    <text x="365" y="426" fill="#F0F6FC" font-size="28" font-weight="700">Kafka · Outbox</text>

    <text x="1135" y="383" fill="#FFA657" font-size="20">VERIFICATION</text>
    <text x="1135" y="426" fill="#F0F6FC" font-size="27" font-weight="700">Test · Recover</text>

    <text x="750" y="449" fill="#C9D1D9" font-size="21" font-weight="600">Observable State</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="90" y="82" fill="#F0F6FC" font-size="30" font-weight="750">BACKEND ENGINEERING</text>
    <text x="90" y="120" fill="#8B949E" font-size="20">Reliable systems · clear state · recoverable failure</text>
  </g>
</svg>