name: Web Quality
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'prisma/**', 'package*.json', '*config*', '.github/workflows/web-quality.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'prisma/**', 'package*.json', '*config*', '.github/workflows/web-quality.yml']
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
